  <title id="study01_design-title">Random assignment across two legal contexts and three outcome-information conditions. Full condition names label the rows and columns; each box shows abbreviated levels and links to its vignette.</title>
  <desc id="study01_design-desc">A two-by-three design grid shows random assignment to one of six conditions. Outside the cells, the rows are labeled illegal abortion and illegal disposal of human remains; the columns are labeled no outcome information, self-managed abortion evidence and financial-crime evidence. Each cell contains the short levels Abortion or Disposal and None, SMA or Financial, plus a View vignette link.</desc>
